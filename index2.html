<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Timer Blackball — Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Exo 2", system-ui, -apple-system, sans-serif;
    background: radial-gradient(140% 100% at 50% 0%, #0d3258 0%, #06192c 60%, #05070d 100%);
    color: #eef2ff;
    display: flex; flex-direction: column;
    touch-action: manipulation;
  }

  /* ===== Barre du haut : reset à gauche, logo au centre ===== */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 0;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  #topbar .side { width: clamp(88px, 22vw, 132px); }
  .logo {
    width: clamp(72px, 18vw, 108px); height: clamp(48px, 12vw, 72px);
    border-radius: 8px; object-fit: contain;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .resetbtn {
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #e10a19; border-radius: 999px; padding: 16px 0;
    width: clamp(88px, 22vw, 132px); min-height: 52px; font-size: 13px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    transition: transform .12s, background .2s;
  }
  .resetbtn:active { transform: scale(.93); }

  /* ===== Écran splitté : chaque équipe possède sa moitié ===== */
  #arena { flex: 1; display: flex; min-height: 0; position: relative; }
  .half {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; position: relative; overflow: hidden;
    transition: filter .3s, opacity .3s;
    padding: 6px;
  }
  .half::before {
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .35s;
  }
  #halfA::before { background: radial-gradient(80% 60% at 20% 20%, rgba(225,10,25,.30), transparent 70%); }
  #halfB::before { background: radial-gradient(80% 60% at 80% 20%, rgba(25,100,175,.30), transparent 70%); }
  .half.active::before { opacity: 1; }
  .half:not(.active) { filter: saturate(.25) brightness(.55); }
  .half .teamname {
    position: absolute; top: 4%; left: 50%; transform: translateX(-50%);
    font-size: min(22vw, 20vh); font-weight: 900; letter-spacing: 0;
    line-height: 1; opacity: .9; margin: 0;
  }
  #halfA .teamname { color: #ff4d5e; }
  #halfB .teamname { color: #4d9de0; }
  .half .hint { font-size: 10px; opacity: .35; letter-spacing: .08em; text-align: center; }
  .half .extwrap { position: absolute; bottom: 8%; }
  .half .extwrap { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
  .extdot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); transition: all .3s; }
  .extdot.used { background: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 8px #4CAF50; }

  /* ===== Anneau central ===== */
  #dial {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(88vw, 70vh); aspect-ratio: 1;
    pointer-events: auto; cursor: pointer;
  }
  #dialGlow { pointer-events: auto; }
  #dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #dial .track { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 10; }
  #dial .prog {
    fill: none; stroke: url(#grad); stroke-width: 10; stroke-linecap: round;
    filter: drop-shadow(0 0 8px rgba(225,10,25,.7));
    transition: stroke-dashoffset .25s linear;
  }
  #dialGlow { position: absolute; inset: 12%; border-radius: 50%;
    background: radial-gradient(circle, rgba(30,45,90,.9), rgba(8,12,22,.95) 75%);
    box-shadow: 0 0 40px rgba(25,100,175,.35), inset 0 0 24px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #timeText { font-size: min(44vw, 42vh); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0; line-height: 1; }
  #timeText.warn { color: #ffb020; text-shadow: 0 0 18px rgba(255,176,32,.6); }
  #timeText.danger { color: #ff4d5e; text-shadow: 0 0 18px rgba(255,77,94,.7); animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  #phaseText { font-size: clamp(10px, 2.6vw, 13px); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #93a0c4; margin-top: 1vh; }

  /* ===== Barre d'actions flottante ===== */
  #dock {
    display: flex; gap: 10px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    justify-content: center; align-items: center;
    background: linear-gradient(to top, rgba(5,7,13,.95), transparent);
  }

  /* ===== Optimisation mode portrait ===== */
  @media (orientation: portrait) {
    #arena { flex-direction: row; }
    #dial { width: min(92vw, 58vh); }
    #timeText { font-size: min(38vw, 34vh); }
    .half .teamname { font-size: min(24vw, 12vh); top: 2%; }
    .half .extwrap { bottom: 10%; }
    .dockbtn { padding: 18px 8px; min-height: 60px; }
    #dock { gap: 8px; }
    #settingsLink { top: max(8px, env(safe-area-inset-top)); }
  }
  @media (orientation: landscape) {
    #dial { width: min(70vw, 85vh); }
    #timeText { font-size: min(28vw, 40vh); }
    .half .teamname { font-size: min(12vw, 18vh); }
  }
  .dockbtn {
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #eef2ff; border-radius: 999px; padding: 20px 10px;
    flex: 1; max-width: 180px; min-height: 64px;
    font-size: clamp(14px, 3.6vw, 17px); font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    transition: transform .12s, background .2s;
  }
  .dockbtn:active { transform: scale(.93); }
  .dockbtn:disabled { opacity: .3; }
  #btnBreak { background: linear-gradient(135deg, #1964af, #e10a19); border: none; }
  #btnPause { background: linear-gradient(135deg, #1964af, #134b83); border: none; }

  #settingsLink {
    position: absolute; top: 10px; right: 12px; z-index: 5;
    font-size: 20px; text-decoration: none; opacity: .45;
  }

  #soundStatus {
    position: fixed; top: 13px; right: 44px; z-index: 50;
    font-size: 15px; opacity: .9; pointer-events: none;
    line-height: 20px;
  }

  #toast {
    position: absolute; left: 50%; top: 16%; transform: translateX(-50%) translateY(-8px);
    background: rgba(20,28,50,.92); border: 1px solid rgba(255,255,255,.15);
    padding: 10px 22px; border-radius: 999px; font-weight: 800; letter-spacing: .05em;
    opacity: 0; transition: all .3s; pointer-events: none; z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<a href="settings.html?from=index2" id="settingsLink" title="Paramètres">⚙️</a>
<div id="soundStatus">🔊</div>
<div id="toast"></div>

<div id="topbar">
  <button class="resetbtn" id="btnReset">⟲ Reset</button>
  <img src="logo.jpg" alt="Logo" class="logo">
  <div class="side"></div>
</div>

<div id="arena">
  <div class="half active" id="halfA">
    <div class="teamname" id="nameA">A</div>
    <div class="extwrap">
      <div class="extdot" id="extDotA"></div>
    </div>
  </div>

  <div id="dial">
    <svg viewBox="0 0 200 200">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e10a19"/>
          <stop offset="100%" stop-color="#1964af"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="88"/>
      <circle class="prog" id="prog" cx="100" cy="100" r="88"/>
    </svg>
    <div id="dialGlow">
      <div id="timeText">90</div>
      <div id="phaseText">Prêt</div>
    </div>
  </div>

  <div class="half" id="halfB">
    <div class="teamname" id="nameB">B</div>
    <div class="extwrap">
      <div class="extdot" id="extDotB"></div>
    </div>
  </div>
</div>

<div id="dock">
  <button class="dockbtn" id="btnBreak">⚡ Casse</button>
  <button class="dockbtn" id="btnHand">Tap main ⏭</button>
  <button class="dockbtn" id="btnPause">⏸ Pause</button>
</div>

<script>
// ===== Paramètres de session (compatibles settings.html) =====
function loadSessionSettings() {
  try {
    const s = JSON.parse(sessionStorage.getItem('timerSettings') || '{}');
    return {
      shotTime: s.shotTime != null ? s.shotTime : 45,
      breakTime: s.breakTime != null ? s.breakTime : 90,
      warningTime: s.warningTime != null ? s.warningTime : 25,
      extensionTime: s.extensionTime != null ? s.extensionTime : 30,
      countdownStart: s.countdownStart != null ? s.countdownStart : 5
    };
  } catch (e) {
    return { shotTime: 45, breakTime: 90, warningTime: 25, extensionTime: 30, countdownStart: 5 };
  }
}
const S = loadSessionSettings();

// ===== État =====
let phase = 'idle';            // idle | break | shot | paused | over
let turn = 'A';                // équipe au timer (casse = A)
let timeRemaining = S.breakTime;
let totalTime = S.breakTime;   // pour l'anneau
let timer = null;
let isPaused = false;
let extUsed = { A: false, B: false };
let extJustGranted = false;    // jamais deux extensions à la suite
let breakUsed = false;
let warningPlayed = false;
let countdownPlayed = false;

// ===== Audio =====
let audioContext = null, audioUnlocked = false;
let wakeLock = null;

// Buffers audio externes (.wav) chargés à volume maximum — identiques à index.html
let sound25sBuffer = null;   // bip d'avertissement à 25s
let sound5sBuffer = null;    // bip du compte à rebours final
const SOUND_25S_URL = 'sounds/25s.wav';
const SOUND_5S_URL = 'sounds/5s.wav';
const MAX_VOLUME = 1.0;

// Empêcher la veille de l'écran (comme index.html)
function preventSleep() {
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then((lock) => {
      if (wakeLock) wakeLock.release();
      wakeLock = lock;
    }).catch(console.log);
  }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function initAudio() {
  if (!audioContext) {
    try { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  }
}
async function preloadSound(url) {
  try {
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    // Compat iOS : forme promesse avec fallback callback
    if (audioContext.decodeAudioData.length === 1) {
      return await audioContext.decodeAudioData(arrayBuffer);
    }
    return await new Promise((resolve, reject) => {
      audioContext.decodeAudioData(arrayBuffer, resolve, reject);
    });
  } catch (e) { return null; }
}
async function preloadAllSounds() {
  initAudio();
  if (!audioContext) return;
  if (audioContext.state === 'suspended') {
    try { await audioContext.resume(); } catch (e) {}
  }
  sound25sBuffer = await preloadSound(SOUND_25S_URL);
  sound5sBuffer = await preloadSound(SOUND_5S_URL);
  // Fallback : si un .wav n'a pas pu être chargé/décodé, générer le son en mémoire
  if (!sound25sBuffer) sound25sBuffer = synthBuffer(0.35, 1250);
  if (!sound5sBuffer) sound5sBuffer = synthCountdownBuffer();
  updateSoundStatus();
}

// Génère un bip simple en mémoire (fallback si le .wav est indisponible)
function synthBuffer(duration, freq) {
  const sr = audioContext.sampleRate;
  const buf = audioContext.createBuffer(1, Math.ceil(sr * duration), sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const t = i / sr;
    data[i] = Math.sin(2 * Math.PI * freq * t) * 0.9 * Math.max(0, 1 - t / duration);
  }
  return buf;
}

// Génère le compte à rebours final + buzzer en mémoire (fallback de 5s.wav)
function synthCountdownBuffer() {
  const sr = audioContext.sampleRate;
  const total = 7; // 5 bips + 1s pause + buzzer
  const buf = audioContext.createBuffer(1, Math.ceil(sr * total), sr);
  const data = buf.getChannelData(0);
  const addTone = (start, dur, freq, vol) => {
    for (let i = Math.floor(start * sr); i < Math.min(Math.floor((start + dur) * sr), data.length); i++) {
      const t = (i / sr) - start;
      data[i] = Math.sin(2 * Math.PI * freq * t) * vol * Math.max(0, 1 - t / dur);
    }
  };
  for (let n = 0; n < 5; n++) addTone(0.5 + n, 0.25, 900, 0.9);   // bips 5-4-3-2-1
  addTone(5.5, 1.4, 200, 1.0);                                   // buzzer
  return buf;
}

// Garantie : si un buffer manque au moment de jouer, tenter un rechargement immédiat
async function ensureSoundsReady() {
  if (sound25sBuffer && sound5sBuffer) return true;
  await preloadAllSounds();
  return sound25sBuffer !== null && sound5sBuffer !== null;
}
function unlockAudio() {
  initAudio();
  if (audioContext) {
    if (audioContext.state === 'suspended') audioContext.resume();
    if (!audioUnlocked) {
      try {
        // iOS : un buffer de silence réel (et non un oscillateur à gain 0) débloque l'audio
        const buffer = audioContext.createBuffer(1, 1, 22050);
        const src = audioContext.createBufferSource();
        src.buffer = buffer;
        src.connect(audioContext.destination);
        src.start(0);
      } catch (e) {}
      audioUnlocked = true;
      updateSoundStatus();
    }
    preloadAllSounds();
  }
}

// Son simple (25s) — non pausable
let currentSource = null;
function playBuffer(buffer) {
  if (!audioContext || !buffer) return;
  stopCurrentSound();
  const source = audioContext.createBufferSource();
  const gainNode = audioContext.createGain();
  source.buffer = buffer;
  source.connect(gainNode); gainNode.connect(audioContext.destination);
  gainNode.gain.value = MAX_VOLUME;
  source.start(0);
  source.onended = () => { if (currentSource === source) currentSource = null; };
  currentSource = source;
}
function stopCurrentSound() {
  if (currentSource) { try { currentSource.stop(); } catch (e) {} currentSource = null; }
}

// Compte à rebours final (5s.wav) avec pause/reprise/reset — comme index.html
let countdownSource = null;
let countdownOffset = 0;
let countdownStartCtxTime = 0;
let countdownPlaying = false;
function playCountdownBeep() {
  if (!audioUnlocked) { unlockAudio(); }
  if (!audioContext) return;
  if (audioContext.state === 'suspended') audioContext.resume();
  if (!sound5sBuffer) { ensureSoundsReady().then(ok => { if (ok) { stopCountdownSound(); countdownOffset = 0; startCountdownSound(); } }); return; }
  stopCountdownSound();
  countdownOffset = 0;
  startCountdownSound();
}
function startCountdownSound() {
  const source = audioContext.createBufferSource();
  const gainNode = audioContext.createGain();
  source.buffer = sound5sBuffer;
  source.connect(gainNode); gainNode.connect(audioContext.destination);
  gainNode.gain.value = MAX_VOLUME;
  countdownStartCtxTime = audioContext.currentTime;
  source.start(0, countdownOffset);
  source.onended = () => {
    if (countdownSource === source) { countdownSource = null; countdownPlaying = false; countdownOffset = 0; }
  };
  countdownSource = source;
  countdownPlaying = true;
}
function pauseCountdownSound() {
  if (!countdownPlaying || !countdownSource) return;
  const elapsed = audioContext.currentTime - countdownStartCtxTime;
  countdownOffset = Math.min(countdownOffset + elapsed, sound5sBuffer.duration);
  try { countdownSource.stop(); } catch (e) {}
  countdownSource = null;
  countdownPlaying = false;
}
function resumeCountdownSound() {
  if (countdownPlaying || !sound5sBuffer) return;
  if (countdownOffset >= sound5sBuffer.duration) { stopCountdownSound(); return; }
  if (timeRemaining <= S.countdownStart && timeRemaining > 0) startCountdownSound();
  else stopCountdownSound();
}
function stopCountdownSound() {
  if (countdownSource) { try { countdownSource.stop(); } catch (e) {} countdownSource = null; }
  countdownPlaying = false;
  countdownOffset = 0;
}
function playWarning() {
  if (!audioUnlocked) { unlockAudio(); }
  if (!audioContext) return;
  if (audioContext.state === 'suspended') audioContext.resume();
  if (!sound25sBuffer) { ensureSoundsReady().then(ok => { if (ok) playBuffer(sound25sBuffer); }); return; }
  playBuffer(sound25sBuffer);
}
function playCountdown() { playCountdownBeep(); }

// ===== Affichage =====
const R = 88, CIRC = 2 * Math.PI * R;
document.getElementById('prog').style.strokeDasharray = CIRC;

function fmt(s) {
  return String(Math.max(0, Math.round(s)));
}
function phaseLabel() {
  if (phase === 'idle') return 'Prêt';
  if (phase === 'break') return 'Casse';
  if (phase === 'shot') return turn === 'A' ? 'A' : 'B';
  if (phase === 'paused') return 'Pause';
  return 'Temps écoulé';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 1600);
}
function updateSoundStatus() {
  let txt = audioUnlocked ? '🔊' : '🔇';
  if (audioUnlocked) {
    if (sound25sBuffer && sound5sBuffer) txt = '🔊';
    else txt = '⏳';   // sons en cours de chargement
  }
  document.getElementById('soundStatus').textContent = txt;
}
function updateDisplay() {
  document.getElementById('timeText').textContent = fmt(timeRemaining);
  document.getElementById('phaseText').textContent = phaseLabel();

  const frac = Math.max(0, Math.min(1, timeRemaining / totalTime));
  document.getElementById('prog').style.strokeDashoffset = CIRC * (1 - frac);

  const tt = document.getElementById('timeText');
  if (phase !== 'idle' && phase !== 'over' && timeRemaining <= 10) tt.className = 'danger';
  else if (phase !== 'idle' && timeRemaining <= S.warningTime) tt.className = 'warn';
  else tt.className = '';

  document.getElementById('halfA').classList.toggle('active', phase !== 'idle' && phase !== 'over' && turn === 'A');
  document.getElementById('halfB').classList.toggle('active', phase !== 'idle' && phase !== 'over' && turn === 'B');
  document.getElementById('extDotA').classList.toggle('used', extUsed.A);
  document.getElementById('extDotB').classList.toggle('used', extUsed.B);

  document.getElementById('btnBreak').disabled = breakUsed || phase === 'break' || phase === 'paused';
  document.getElementById('btnPause').disabled = phase === 'idle' || phase === 'over';
  document.getElementById('btnHand').disabled = phase === 'idle' || phase === 'over';
  updateSoundStatus();
}

// ===== Moteur =====
function stopTimer() { clearInterval(timer); timer = null; }
function startInterval() {
  stopTimer();
  preventSleep();
  timer = setInterval(() => {
    if (isPaused) return;
    timeRemaining--;
    updateDisplay();
    if (timeRemaining === S.warningTime && !warningPlayed) {
      playWarning(); warningPlayed = true;
    }
    if (timeRemaining === S.countdownStart && !countdownPlayed) {
      playCountdown(); countdownPlayed = true;
    }
    if (timeRemaining <= 0) {
      stopTimer();
      phase = 'over';
      // le buzzer de fin est inclus à la fin de 5s.wav (comme index.html)
      if (countdownPlaying) {
        // laisse le fichier finir (buzzer final)
      } else {
        playCountdownBeep();
      }
      toast('⏱ Temps écoulé');
      releaseWakeLock();
      updateDisplay();
    }
  }, 1000);
}
function startBreak() {
  if (breakUsed) return;
  breakUsed = true;
  unlockAudio();
  phase = 'break'; turn = 'A'; isPaused = false;
  timeRemaining = totalTime = S.breakTime;
  warningPlayed = false; countdownPlayed = false; extJustGranted = false;
  startInterval();
  updateDisplay();
}
function handOver() {
  if (phase === 'over' || phase === 'idle') return;
  unlockAudio();
  // Le compteur repart pour l'équipe sélectionnée (turn) — pas de bascule automatique A/B
  phase = 'shot';
  timeRemaining = totalTime = S.shotTime;
  isPaused = false;
  stopCountdownSound();
  stopCurrentSound();
  warningPlayed = false; countdownPlayed = false;
  extJustGranted = false;      // un nouveau coup réautorise une extension
  startInterval();
  toast('▶ ' + (turn === 'A' ? nameA() : nameB()));
  updateDisplay();
}

// Sélection manuelle de l'équipe au compteur (tap sur A ou B)
function selectTeam(team) {
  if (phase === 'idle' || phase === 'over') return;
  unlockAudio();
  if (phase === 'break') return;   // pendant la casse : équipe A imposée
  if (turn === team) return;      // déjà sélectionnée
  turn = team;
  // Le compteur en cours bascule pour la nouvelle équipe, au temps restant du coup en cours
  toast('Sélection ' + (team === 'A' ? nameA() : nameB()));
  updateDisplay();
}
function nameA() { const n = document.getElementById('nameA').textContent; return n || 'A'; }
function nameB() { const n = document.getElementById('nameB').textContent; return n || 'B'; }

function addExtension(team) {
  if (phase !== 'break' && phase !== 'shot' && phase !== 'paused') return;
  if (phase === 'paused') return;
  if (extUsed[team]) { toast('Extension déjà utilisée'); return; }
  if (extJustGranted) { toast('Une seule extension à la suite'); return; }
  if (phase === 'break' && team !== 'A') return;   // pendant la casse : équipe A
  if (phase === 'shot' && team !== turn) return;   // seulement l'équipe au timer
  unlockAudio();
  extUsed[team] = true;
  extJustGranted = true;
  timeRemaining += S.extensionTime;
  totalTime = Math.max(totalTime, timeRemaining);
  // Si le compte à rebours sonore a démarré, l'arrêter et le remettre à zéro pour pouvoir le relire
  stopCountdownSound();
  countdownPlayed = false;
  warningPlayed = false;   // le bip 25s se redéclenchera seulement si le compteur repasse par 25s
  toast('+30s ' + (team === 'A' ? nameA() : nameB()));
  updateDisplay();
}

function togglePause() {
  if (phase === 'idle' || phase === 'over') return;
  unlockAudio();
  isPaused = !isPaused;
  document.getElementById('btnPause').textContent = isPaused ? '▶ Reprendre' : '⏸ Pause';
  if (isPaused) pauseCountdownSound();
  else resumeCountdownSound();
  toast(isPaused ? '⏸ Pause' : '▶ Reprise');
  updateDisplay();
}
function resetAll() {
  stopTimer();
  releaseWakeLock();
  stopCountdownSound();
  stopCurrentSound();
  phase = 'idle'; turn = 'A'; isPaused = false; breakUsed = false;
  timeRemaining = totalTime = S.breakTime;
  extUsed = { A: false, B: false };
  extJustGranted = false;
  warningPlayed = false; countdownPlayed = false;
  document.getElementById('btnPause').textContent = '⏸ Pause';
  updateDisplay();
}

// ===== Interactions =====
document.getElementById('btnBreak').addEventListener('click', startBreak);
document.getElementById('btnHand').addEventListener('click', handOver);
document.getElementById('btnPause').addEventListener('click', togglePause);
document.getElementById('btnReset').addEventListener('click', resetAll);

// UX : double-tap sur sa moitié = demander l'extension de SON équipe
let tapTime = { A: 0, B: 0 };
const DOUBLE_TAP_MS = 350;
function halfTapped(team) {
  unlockAudio();
  const now = Date.now();
  if (now - tapTime[team] < DOUBLE_TAP_MS) {
    tapTime[team] = 0;
    addExtension(team);
  } else {
    // tap simple : sélectionne l'équipe au compteur
    selectTeam(team);
    tapTime[team] = now;
  }
}
document.getElementById('halfA').addEventListener('click', () => halfTapped('A'));
document.getElementById('halfB').addEventListener('click', () => halfTapped('B'));

// Double-tap n'importe où dans le cercle : s'applique à l'équipe au timer
document.getElementById('dial').addEventListener('click', () => {
  unlockAudio();
  halfTapped(isBreakTime() ? 'A' : turn);
});
function isBreakTime() { return phase === 'break'; }

// iOS : déverrouiller l'audio au premier toucher n'importe où sur la page
document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.body.addEventListener('click', unlockAudio, { once: true });

// Noms d'équipes persistés (settings.html peut les définir)
try {
  const n = JSON.parse(sessionStorage.getItem('timerNames') || '{}');
  if (n.A) document.getElementById('nameA').textContent = n.A;
  if (n.B) document.getElementById('nameB').textContent = n.B;
} catch (e) {}

updateDisplay();
</script>
</body>
</html>
